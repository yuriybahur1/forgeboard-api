[project]
name = "workstream-api"
version = "0.1.0"
description = "Multi-tenant project and issue management API"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.16,<2", "argon2-cffi>=23.1,<26", "celery[redis]>=5.5,<6",
  "email-validator>=2.2,<3", "fastapi>=0.116,<1", "jinja2>=3.1,<4",
  "prometheus-client>=0.22,<1", "psycopg[binary,pool]>=3.2,<4",
  "pydantic-settings>=2.10,<3", "pyjwt>=2.10,<3", "redis>=6,<7",
  "sqlalchemy[asyncio]>=2.0.41,<3", "structlog>=25.4,<26", "uvicorn[standard]>=0.35,<1",
]
[dependency-groups]
dev = [
  "httpx>=0.28,<1", "mypy>=1.17,<2", "pip-audit>=2.9,<3", "pre-commit>=4.2,<5",
  "pytest>=9.0.3,<10", "pytest-asyncio>=1.1,<2", "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1", "testcontainers[postgres,redis]>=4.10,<5", "types-pyjwt>=1.7,<2",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/workstream"]
[tool.ruff]
target-version = "py313"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM", "RUF"]
ignore = ["S101"]
[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
files = ["src"]
[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true
disallow_untyped_decorators = false
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers --cov=workstream --cov-report=term-missing --cov-fail-under=55"
