name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_DB: workstream_test, POSTGRES_USER: workstream, POSTGRES_PASSWORD: workstream}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U workstream" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WORKSTREAM_ENVIRONMENT: test
      WORKSTREAM_DATABASE_URL: postgresql+psycopg://workstream:workstream@localhost:5432/workstream_test
      WORKSTREAM_ASYNC_DATABASE_URL: postgresql+psycopg_async://workstream:workstream@localhost:5432/workstream_test
      WORKSTREAM_REDIS_URL: redis://localhost:6379/0
      WORKSTREAM_TEST_DATABASE_URL: postgresql+psycopg://workstream:workstream@localhost:5432/workstream_test
      WORKSTREAM_TEST_ASYNC_DATABASE_URL: postgresql+psycopg_async://workstream:workstream@localhost:5432/workstream_test
      WORKSTREAM_TEST_REDIS_URL: redis://localhost:6379/1
      WORKSTREAM_JWT_SECRET: test-only-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --frozen --all-groups
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest -m unit --no-cov
      - run: uv run pytest -m "integration and not concurrency" --no-cov
      - run: uv run pytest -m concurrency --no-cov
      - run: uv run pytest --cov-fail-under=80
      - run: uv run pip-audit
      - run: docker build .
