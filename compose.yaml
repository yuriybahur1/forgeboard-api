services:
  postgres:
    image: postgres:17-alpine
    environment: {POSTGRES_DB: workstream, POSTGRES_USER: workstream, POSTGRES_PASSWORD: workstream}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U workstream"], interval: 5s, timeout: 3s, retries: 10}
  redis:
    image: redis:8-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes: [redis-data:/data]
    healthcheck: {test: [CMD, redis-cli, ping], interval: 5s, timeout: 3s, retries: 10}
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["8025:8025"]
  api: &app
    build: .
    env_file: [.env]
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    stop_grace_period: 30s
  worker:
    <<: *app
    ports: []
    command: [celery, -A, workstream.infrastructure.celery_app:celery_app, worker, --loglevel=INFO]
  beat:
    <<: *app
    ports: []
    command: [celery, -A, workstream.infrastructure.celery_app:celery_app, beat, --loglevel=INFO, --schedule=/tmp/celerybeat-schedule]
  migrate:
    build: .
    env_file: [.env]
    command: [alembic, upgrade, head]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
volumes: {postgres-data: {}, redis-data: {}}
